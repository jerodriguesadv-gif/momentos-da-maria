<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentos da Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ef; --stripe:rgba(232,150,150,.22); --card:#fffdf9; --wine:#6e1420; --red:#c8202f; --ink:#4a1d1f; --muted:#7a5a5c; --line:#e6b7bd; --dot:#e9c3c8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a1517;--stripe:rgba(232,120,130,.10);--card:#3a1f22;--wine:#f3c6cb;--red:#ff8a93;--ink:#f6e4e1;--muted:#d1aeb0;--line:#6b3b40;--dot:#6b3b40;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2a1517;--stripe:rgba(232,120,130,.10);--card:#3a1f22;--wine:#f3c6cb;--red:#ff8a93;--ink:#f6e4e1;--muted:#d1aeb0;--line:#6b3b40;--dot:#6b3b40;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Quicksand",system-ui,sans-serif;color:var(--ink);
  background-color:var(--bg);
  background-image:repeating-linear-gradient(90deg,transparent 0 40px,var(--stripe) 40px 58px,transparent 58px 96px),repeating-linear-gradient(0deg,transparent 0 40px,var(--stripe) 40px 58px,transparent 58px 96px);
  overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center}
.bow{width:min(52vw,230px);margin-bottom:-8px;animation:sway 4.5s ease-in-out infinite;transform-origin:50% 30%;filter:drop-shadow(0 4px 6px rgba(120,20,30,.18))}
.pre{font-family:"Dancing Script",cursive;font-weight:700;color:var(--red);font-size:clamp(24px,7vw,34px);margin:4px 0 0}
h1{font-family:"Alex Brush",cursive;font-weight:400;color:var(--wine);font-size:clamp(68px,22vw,110px);line-height:.95;margin:0}
.sub{color:var(--muted);font-weight:600;letter-spacing:.18em;font-size:13px;text-transform:uppercase;margin:4px 0 18px}
.frame{position:relative;width:100%;background:var(--card);border:2px solid var(--wine);border-radius:22px;padding:12px;box-shadow:0 14px 40px rgba(110,20,32,.18)}
.stage{position:relative;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#f3e3df;touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;align-items:center;justify-content:center}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.slide.on img{animation:kb 6s ease-out forwards}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px;width:100%;height:100%;
  background:repeating-linear-gradient(45deg,rgba(232,150,150,.12) 0 14px,transparent 14px 28px)}
.ph svg{width:70px;height:auto}
.ph b{font-family:"Dancing Script",cursive;font-size:30px;color:var(--wine)}
.end{background:var(--card);flex-direction:column;gap:6px;text-align:center;padding:24px}
.end .t1{font-family:"Dancing Script",cursive;font-weight:700;color:var(--red);font-size:30px}
.end .t2{font-family:"Alex Brush",cursive;color:var(--wine);font-size:84px;line-height:.9}
.end img{width:52%;height:auto;object-fit:contain;transform:none;animation:none}
.cap{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px 2px}
.cap .c1{font-family:"Dancing Script",cursive;font-weight:700;font-size:28px;color:var(--wine);line-height:1.1}
.cap .c2{font-size:15px;color:var(--muted);margin-top:2px}
.nav{position:absolute;top:calc(12px + (100% - 24px - 62px)/2);transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,253,249,.85);color:#6e1420;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav.l{left:18px}.nav.r{right:18px}
.nav:focus-visible,.ctl button:focus-visible,.dots button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px;max-width:100%}
.dots button{width:10px;height:10px;border-radius:5px;border:none;background:var(--dot);padding:0;cursor:pointer;transition:all .3s}
.dots button.on{width:26px;background:var(--red)}
.ctl{display:flex;gap:10px;margin-top:8px}
.ctl button{font:inherit;font-weight:600;font-size:15px;color:var(--wine);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.bar{position:absolute;left:12px;right:12px;top:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.4);overflow:hidden;z-index:3}
.bar i{display:block;height:100%;width:0;background:#fff}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.foot .v{font-family:"Dancing Script",cursive;font-size:19px;color:var(--ink)}
.icons{display:flex;gap:14px;justify-content:center;margin-top:12px}
.icons svg{width:28px;height:auto;animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
.icons svg:nth-child(2){animation-delay:-1s}.icons svg:nth-child(3){animation-delay:-2s}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(2deg)}75%{transform:rotate(-2deg)}}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// Fotos: troque null pela imagem e ajuste as legendas.
const SLIDES=[
  {src:null,t:"Bem-vinda, Maria!",s:"O dia em que você chegou"},
  {src:null,t:"1 mês",s:""},{src:null,t:"2 meses",s:""},{src:null,t:"3 meses",s:""},
  {src:null,t:"4 meses",s:""},{src:null,t:"5 meses",s:""},{src:null,t:"6 meses",s:""},
  {src:null,t:"7 meses",s:""},{src:null,t:"8 meses",s:""},{src:null,t:"9 meses",s:""},
  {src:null,t:"10 meses",s:""},{src:null,t:"11 meses",s:""},
  {end:true,t:"1 aninho!",s:"Obrigada por celebrar comigo"}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),c1=document.getElementById('c1'),c2=document.getElementById('c2'),bar=document.getElementById('bar'),playBtn=document.getElementById('play');
const els=SLIDES.map((sl,i)=>{
  const d=document.createElement('div');d.className='slide';d.setAttribute('role','group');d.setAttribute('aria-label',`${i+1} de ${SLIDES.length}`);
  if(sl.end){d.classList.add('end');d.innerHTML=`<span class="t1">Obrigada por fazer parte!</span><span class="t2">Maria</span><img src="${BABY}" alt="Ilustração da Maria bebê">`;}
  else if(sl.src){d.innerHTML=`<img src="${sl.src}" alt="${sl.t}">`;}
  else{d.innerHTML=`<div class="ph"><svg viewBox="0 0 40 46"><use href="#straw"/></svg><b>${sl.t}</b><span>[foto]</span></div>`;}
  stage.appendChild(d);
  const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-label',sl.t);b.onclick=()=>{go(i);restart()};dots.appendChild(b);
  return d;
});
let cur=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,timer=null,t0=0;const DUR=4500;
function go(i){cur=(i+els.length)%els.length;els.forEach((e,k)=>{e.classList.toggle('on',k===cur)});[...dots.children].forEach((b,k)=>{b.classList.toggle('on',k===cur);b.setAttribute('aria-selected',k===cur)});c1.textContent=SLIDES[cur].t;c2.textContent=SLIDES[cur].s||'';
  const im=els[cur].querySelector('img');if(im&&!SLIDES[cur].end){im.style.animation='none';void im.offsetWidth;im.style.animation='';}}
function tick(now){if(playing){const p=Math.min(1,(now-t0)/DUR);bar.style.width=(p*100)+'%';if(p>=1){go(cur+1);t0=now;}}requestAnimationFrame(tick)}
function restart(){t0=performance.now();bar.style.width='0%'}
document.getElementById('next').onclick=()=>{go(cur+1);restart()};
document.getElementById('prev').onclick=()=>{go(cur-1);restart()};
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pausar':'Continuar';playBtn.setAttribute('aria-pressed',playing);restart()};
let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){go(cur+(dx<0?1:-1));restart()}sx=null});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(cur+1);restart()}if(e.key==='ArrowLeft'){go(cur-1);restart()}});
if(!playing){playBtn.textContent='Continuar';playBtn.setAttribute('aria-pressed','false')}
go(0);restart();requestAnimationFrame(tick);
</script>
